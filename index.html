<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envelope</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#ffe3ef,#ffc1d8);
  font-family:sans-serif;
}

.wrapper{
  width:90vw;
  max-width:360px;
  aspect-ratio:3/2;
  position:relative;
  perspective:1000px;
  overflow:hidden;
}

/* กระดาษ */
.letter{
  position:absolute;
  inset:8%;
  background:white;
  padding:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* รูป */
.photo{
  max-width:75%;
  max-height:75%;
  object-fit:contain;
  border-radius:8px;
  background:#f5f5f5;
}

/* ซอง */
.envelope{
  position:absolute;
  inset:0;
  z-index:10;
  cursor:pointer;
  filter:drop-shadow(0 10px 25px rgba(0,0,0,.3));
  transition:transform 1s ease;
}
.env-base{
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#ffb2cc,#ff7ea9);
}
.env-bottom{
  position:absolute;
  bottom:0;
  width:100%;
  height:60%;
  background:linear-gradient(#ff7aa7,#ff4f87);
  clip-path:polygon(0 0,50% 65%,100% 0,100% 100%,0 100%);
}
.env-top{
  position:absolute;
  top:0;
  width:100%;
  height:60%;
  background:linear-gradient(#ff5a8f,#ff3b79);
  clip-path:polygon(0 0,100% 0,50% 72%);
  transform-origin:top;
  transition:.8s ease;
}

/* เปิด */
.wrapper.open .env-top{
  transform:rotateX(180deg);
}

/* เลื่อนลง */
.wrapper.open .envelope{
  transform:translateY(120%);
}

/* ปิดฝาอัตโนมัติเมื่อซองลงสุด */
.wrapper.open .env-top{
  animation:closeFlap .5s ease .9s forwards;
}

@keyframes closeFlap{
  to{
    transform:rotateX(0deg);
  }
}

.hint{
  position:absolute;
  bottom:-38px;
  width:100%;
  text-align:center;
  color:#ff4f87;
}
</style>
</head>

<body>

<div class="wrapper" onclick="this.classList.toggle('open')">

  <div class="letter">
    <img src="https://i.postimg.cc/SRtDjVy2/dawn-hold.jpg" class="photo">
  </div>

  <div class="envelope">
    <div class="env-base"></div>
    <div class="env-bottom"></div>
    <div class="env-top"></div>
  </div>

  <div class="hint">แตะซองเพื่อเปิด 📩</div>

</div>

</body>
</html>
